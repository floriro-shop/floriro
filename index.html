<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فلوريرو">
<title>فلوريرو</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Playfair+Display:ital,wght@1,700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#fff7f4;--bg2:#ffe6ec;--card:#ffffff;--tx:#2a1c22;--lb:#4f3a43;--mut:#6a535d;--pri:#d81b60;--pri2:#e8643d;--ptx:#ffffff;--bd:#ecd3db;--ok:#1f7a4a;--bad:#c62828;--warn:#a85d00;--c3:#6f5bb3;--sh:0 6px 22px rgba(216,27,96,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f12;--bg2:#26171e;--card:#221a1f;--tx:#fbf1f4;--lb:#e6d0d8;--mut:#cdb3bd;--pri:#ff6f9d;--pri2:#ffa07c;--ptx:#2b0a16;--bd:#44323a;--ok:#7fd6a2;--bad:#ff9a9a;--warn:#ffc069;--c3:#b6a6ee;--sh:0 6px 22px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#150f12;--bg2:#26171e;--card:#221a1f;--tx:#fbf1f4;--lb:#e6d0d8;--mut:#cdb3bd;--pri:#ff6f9d;--pri2:#ffa07c;--ptx:#2b0a16;--bd:#44323a;--ok:#7fd6a2;--bad:#ff9a9a;--warn:#ffc069;--c3:#b6a6ee;--sh:0 6px 22px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.65;background:radial-gradient(circle at 100% 0,var(--bg2),transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
main{max-width:620px;margin:0 auto;padding:16px 14px 140px}
.hero{position:relative;overflow:hidden;color:var(--ptx);background:linear-gradient(135deg,var(--pri),var(--pri2));border-radius:0 0 30px 30px;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 18px;text-align:center;box-shadow:var(--sh)}
.hero svg.f{position:absolute;opacity:.14;pointer-events:none;color:var(--ptx)}
.f1{width:150px;top:-48px;right:-34px}.f2{width:96px;bottom:-30px;left:-18px;transform:rotate(25deg)}
.fbl{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--pri),var(--pri2))}
.fbl.hide{display:none}
.fbl-card{width:100%;max-width:380px;background:var(--card);border-radius:24px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px;text-align:center}
.fbl-logo{width:200px;max-width:70%;margin:0 auto;filter:invert(1) hue-rotate(180deg) brightness(.35) sepia(1) saturate(6) hue-rotate(300deg)}
.fbl-card h2{margin:0;font-size:22px;color:var(--tx)}.fbl-card h2 small{font-size:13px;color:var(--mut);font-weight:400}
.fbl-card input{font:inherit;font-size:17px;padding:13px 14px;border:2px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);direction:ltr;text-align:center}
.fbl-card input:focus{outline:none;border-color:var(--pri)}
.fbl-card button{font:inherit;font-size:18px;font-weight:700;padding:13px;border:0;border-radius:14px;color:var(--ptx);background:linear-gradient(135deg,var(--pri),var(--pri2));cursor:pointer}
.fbl-card button:disabled{opacity:.6}
.fbl-msg{min-height:22px;color:var(--bad);font-size:15px}
.outb{margin-inline-start:8px}
.logo{position:relative;display:block;margin:2px auto 4px;width:min(250px,68vw);height:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand{position:relative;font-family:"Aref Ruqaa","Amiri",serif;font-size:40px;line-height:1.3}
html[lang="en"] .brand{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:36px}
.sub{position:relative;font-size:14px;font-weight:500}
.clock{position:relative;margin:10px auto 0;display:inline-flex;flex-direction:column;align-items:center;gap:0;padding:8px 20px 9px;border-radius:18px;background:rgba(255,255,255,.16);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.28)}
.ck-time{font-size:30px;font-weight:800;line-height:1.15;letter-spacing:.5px;font-variant-numeric:tabular-nums;unicode-bidi:plaintext}
.ck-date{font-size:15px;font-weight:700;line-height:1.4}
.ck-hij{font-size:13px;font-weight:500;opacity:.9;line-height:1.4}

.lockb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:4px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
h2{font-size:17px;margin:20px 4px 10px;color:var(--lb);font-weight:800}
h2::before{content:"✿ ";color:var(--pri)}
h3{margin:6px 0 12px;font-size:19px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
label{display:block;font-size:15px;color:var(--lb);margin:14px 4px 6px;font-weight:700}
label:first-child{margin-top:0}
input,select,textarea{width:100%;min-height:50px;padding:12px 14px;border:2px solid var(--bd);border-radius:14px;font:inherit;font-size:17px;background:var(--bg);color:var(--tx);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 20%,transparent)}
textarea{min-height:200px;resize:none;font-size:15px}
.seg,.chips{display:flex;gap:8px;margin:6px 0}
.seg button,.chips button{flex:1;min-height:46px;padding:8px 10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s}
.seg button.on,.chips button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--ptx);border-color:transparent}
.chips.q button{min-height:38px;font-size:14px;padding:4px}
.go{display:block;width:100%;min-height:54px;margin-top:20px;padding:14px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--ptx);font:inherit;font-size:18px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 8px 20px color-mix(in srgb,var(--pri) 30%,transparent);transition:transform .15s}
.go:active{transform:scale(.97)}.go:disabled{opacity:.5}
.go.sm{display:inline-block;width:auto;margin:0;min-height:44px;padding:8px 16px;font-size:16px;box-shadow:none}
.go.alt{background:var(--card);color:var(--pri);border:2px solid var(--pri);box-shadow:none}
.go.dng{background:var(--card);color:var(--bad);border:2px solid var(--bad);box-shadow:none;margin-top:10px;font-size:16px}
.msg{margin-top:14px;padding:10px;border-radius:14px;text-align:center;display:none;font-weight:700}
.msg.ok{display:block;color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.msg.ok::before{content:"🌸 "}
.msg.bad{display:block;color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);animation:shake .4s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.k small{color:var(--mut);display:block;font-size:14px;font-weight:500}
.k b{font-size:24px}
.k.w{grid-column:1/-1}
.k.big{background:linear-gradient(135deg,var(--pri),var(--pri2));border:0;color:var(--ptx)}
.k.big small{color:inherit;opacity:.92}.k.big b{font-size:36px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.wst{color:var(--warn)}
.dl{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.25)}
.k:not(.big) .dl.up{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.k:not(.big) .dl.dn{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--bg2);color:var(--lb);white-space:nowrap}
.tag.red{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}.tag.grn{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.tag.amb{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.bars{display:flex;align-items:flex-end;gap:7px;height:130px;direction:ltr}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut);border:0;background:none;padding:0;font-family:inherit;cursor:pointer}
.bar i{display:block;width:100%;background:linear-gradient(to top,var(--pri),color-mix(in srgb,var(--pri2) 55%,#fff));border-radius:10px 10px 4px 4px;min-height:3px;transition:height .6s}
.bar.sel span{color:var(--pri);font-weight:800}.bar.sel i{box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
.dd{text-align:center;font-size:14px;color:var(--mut);margin-top:10px;min-height:22px}
.split{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--bd);margin:6px 0 12px}
.split i{display:block;height:100%;transition:width .6s}
.lg{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:16px}
.lg small{display:block;color:var(--mut);font-size:13px}
.lg u{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:8px;text-decoration:none}
.tp{padding:8px 0}
.tp div{display:flex;justify-content:space-between;font-size:16px}
.tp em{display:block;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--pri),var(--pri2));margin-top:5px;transition:width .6s}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--bd);font-size:16px}
.row:last-child{border-bottom:0}
.del{border:2px solid var(--bd);background:none;color:var(--bad);border-radius:999px;padding:4px 14px;min-height:38px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.del.pr{color:var(--pri)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;background:var(--card);border:1px solid var(--bd);border-radius:18px;cursor:pointer;transition:transform .12s}
.lrow:active{transform:scale(.98)}
.lrow .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--bg2);flex:none}
.lrow .mid{flex:1;min-width:0;font-size:16px}.lrow small{display:block;color:var(--mut);font-size:14px}
.lrow b{font-size:17px;white-space:nowrap}
.hide{display:none!important}
.note{color:var(--mut);font-size:15px;text-align:center;padding:14px}
.mut{color:var(--mut);font-size:15px}
.subtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;min-height:44px;padding:6px 18px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.subtabs button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--ptx);border-color:transparent}
.oc{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.oc.today{border:2px solid var(--pri)}.oc.late{border:2px solid var(--bad)}
.oc .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:18px}
.oc .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.oc .acts .go{flex:1;min-width:110px}
details.cdet{margin-top:14px;border:2px dashed var(--bd);border-radius:14px;padding:4px 12px 12px}
details.cdet summary{cursor:pointer;font-weight:700;color:var(--lb);padding:10px 0;min-height:44px}
.dz{border-color:var(--bad)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.filebtn{margin-top:6px;cursor:pointer;min-height:50px;font-size:16px}
.invprev{margin-top:10px;text-align:center;font-size:15px;color:var(--lb)}
.invprev img,.invimg{max-width:100%;max-height:260px;border-radius:14px;border:1px solid var(--bd);margin-top:6px}
.gbar{height:14px;border-radius:999px;background:var(--bd);overflow:hidden;margin:10px 0}
.gbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .8s}
.gpct{font-size:32px;font-weight:800;color:var(--pri)}
.foot{text-align:center;margin-top:26px}
.langb{min-height:46px;padding:8px 22px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
nav.nav{position:fixed;z-index:9;left:10px;right:10px;margin:auto;max-width:600px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:6px;border-radius:28px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);box-shadow:0 10px 36px rgba(216,27,96,.22)}
nav.nav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 2px;border:0;background:none;color:var(--mut);border-radius:22px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .25s;min-width:0}
nav.nav button span{font-size:22px;line-height:1.2}
nav.nav button em{font-style:normal;white-space:nowrap}
nav.nav button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--ptx);transform:translateY(-3px)}
.pl{position:absolute;top:0;left:8px;font-size:10px;text-decoration:none}
body.unl .pl{display:none}
.lockc{text-align:center;padding:24px 18px}
.lk{font-size:44px}.lt{font-weight:800;margin:4px 0 14px;font-size:18px}
.dots{display:flex;justify-content:center;gap:12px;margin-bottom:18px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--pri);transition:all .15s}
.dots i.f{background:var(--pri);transform:scale(1.15)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:270px;margin:0 auto;direction:ltr}
.pad button{font:inherit;font-size:24px;font-weight:700;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:50%;aspect-ratio:1;cursor:pointer;transition:transform .1s}
.pad button:active{transform:scale(.9);background:var(--bg2)}
.pad button.ok{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--ptx);border:0}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sh-bg{position:absolute;inset:0;background:rgba(20,8,14,.6);backdrop-filter:blur(3px);animation:fade .2s}
.sh-card{position:relative;width:100%;max-width:620px;max-height:92vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.9,.3,1)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--bd);margin:0 auto 8px}
.petal{position:fixed;top:-30px;z-index:50;pointer-events:none;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(420deg);opacity:.25}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  window.__dbg=bar;
  window.addEventListener('error',function(e){bar('JS error: '+(e.message||'')+' @'+(e.lineno||''))});

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nd=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const num=s=>parseFloat(nd(s).replace(/٫/g,'.').replace(/[,،]/g,'').replace(/[^\d.]/g,''));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const DAY=86400000,OFF=10800000;
const dayKey=ts=>new Date(ts+OFF).toISOString().slice(0,10);
const dayStart=k=>Date.parse(k+'T00:00:00+03:00');
const hhmm=ts=>new Date(ts).toLocaleTimeString('en-GB',{timeZone:'Asia/Riyadh',hour:'2-digit',minute:'2-digit'});
const dtLocal=ts=>new Date(ts+OFF).toISOString().slice(0,16);
const fromLocal=v=>Date.parse(v+':00+03:00');
const cleanPhone=s=>{const d=nd(s).replace(/\D/g,'');return d.length>=7?d:''};
function waLink(phone,text){
  let d=cleanPhone(phone);if(!d)return '';
  if(d.startsWith('00'))d=d.slice(2);
  else if(d.startsWith('0')&&d.length===10)d='966'+d.slice(1);
  else if(d.startsWith('5')&&d.length===9)d='966'+d;
  return 'https://wa.me/'+d+(text?'?text='+encodeURIComponent(text):'');
}
async function hash(p){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('flr'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){return 'p'+p}
}

function buildPad(root,verify,onOk){
  let buf='';
  root.innerHTML='<div class="dots"></div><div class="pad">'+['1','2','3','4','5','6','7','8','9','⌫','0','✓'].map(k=>`<button type="button" data-k="${k}" class="${k==='✓'?'ok':''}">${k}</button>`).join('')+'</div><div class="msg"></div>';
  const dotsEl=root.querySelector('.dots'),msgEl=root.querySelector('.msg');
  const draw=()=>{const n=Math.max(4,buf.length);dotsEl.innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<buf.length?'f':''}"></i>`).join('')};
  const p={root,async key(k){
    if(k==='⌫')buf=buf.slice(0,-1);
    else if(k==='✓'){
      const b=buf;buf='';draw();
      if(await verify(b))onOk();
      else{msgEl.textContent=T('wrongPin');msgEl.className='msg bad';setTimeout(()=>{msgEl.className='msg'},2500)}
      return;
    }else if(buf.length<8)buf+=k;
    draw();
  }};
  root.querySelector('.pad').onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)p.key(k)};
  draw();activePad=p;return p;
}
document.addEventListener('keydown',e=>{
  const p=activePad;
  if(!p||!document.body.contains(p.root)||p.root.offsetParent===null)return;
  if(/^[0-9]$/.test(e.key))p.key(e.key);else if(e.key==='Backspace')p.key('⌫');else if(e.key==='Enter')p.key('✓');
});

// ================= فواتير الشراء (صورة / PDF) =================
let invFile=null,invCur=null;
const CH=180000;
function b64enc(u8){let t='';for(let i=0;i<u8.length;i+=0x8000)t+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(t)}
function b64dec(b){const t=atob(b),u=new Uint8Array(t.length);for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u}
function readImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej({code:'bad'})};im.src=u})}
async function packFile(file){
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name||'')){
    if(file.size>2*1024*1024)throw {code:'big'};
    return {mime:'application/pdf',b64:b64enc(new Uint8Array(await file.arrayBuffer())),name:file.name||'invoice.pdf'};
  }
  const im=await readImg(file);let max=1600,q=.8,out=null;
  for(let k=0;k<8;k++){
    const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
    const url=c.toDataURL('image/jpeg',q);out=url.slice(url.indexOf(',')+1);
    if(out.length<=2*CH)break;
    q=Math.max(.5,q-.1);max=Math.max(900,max-200);
  }
  if(!out||out.length>2*CH)throw {code:'bad'};
  return {mime:'image/jpeg',b64:out,name:(file.name||'invoice').replace(/\.\w+$/,'')+'.jpg'};
}
async function uploadInv(file){
  const f=await packFile(file),id=Date.now().toString(36)+Math.random().toString(36).slice(2,7),parts=Math.ceil(f.b64.length/CH);
  const inv={id,mime:f.mime,name:f.name,parts};
  try{
    for(let i=0;i<parts;i+=4){
      await Promise.all(Array.from({length:Math.min(4,parts-i)},(_,j)=>db.doc('invfiles/'+id+'_'+(i+j)).set({fid:id,n:i+j,data:f.b64.slice((i+j)*CH,(i+j+1)*CH)})));
    }
  }catch(e){await delParts(inv);throw e}
  return inv;
}
async function delParts(inv){for(let i=0;i<(inv.parts||0);i++){try{await db.doc('invfiles/'+inv.id+'_'+i).delete()}catch(e){}}}
async function loadInv(inv){
  let b='';
  for(let i=0;i<inv.parts;i++){const sn=await db.doc('invfiles/'+inv.id+'_'+i).get();if(!sn.exists)throw new Error('missing');b+=sn.data().data}
  return b;
}

// ================= اللوحة =================
function ranges(per){
  const now=Date.now(),today=dayKey(now);
  if(per==='day'){const y=dayKey(now-DAY);return{cur:[today,today],prev:[y,y],lab:T('prevDay')}}
  if(per==='week')return{cur:[dayKey(now-6*DAY),today],prev:[dayKey(now-13*DAY),dayKey(now-7*DAY)],lab:T('prevWeek')};
  const [Y,M,Dd]=today.split('-').map(Number);
  const pm=new Date(Date.UTC(Y,M-2,1)).toISOString().slice(0,7);
  const dim=new Date(Date.UTC(Y,M-1,0)).getUTCDate();
  return{cur:[today.slice(0,7)+'-01',today],prev:[pm+'-01',pm+'-'+String(Math.min(Dd,dim)).padStart(2,'0')],lab:T('prevMonth')};
}
function agg(r){
  const o={s:0,p:0,n:0,cash:0,net:0,tr:0,prod:{}};
  docs.forEach(d=>{
    const x=d.data(),k=dayKey(x.ts);
    if(k<r[0]||k>r[1])return;
    if(x.type==='sale'){o.s+=x.amount;if(!x.dep)o.n++;if(x.pay==='كاش')o.cash+=x.amount;else if(x.pay==='شبكة')o.net+=x.amount;else o.tr+=x.amount;o.prod[x.item]=(o.prod[x.item]||0)+x.amount}
    else o.p+=x.amount;
  });
  return o;
}
function aggW(r){
  const o={c:0,n:0,reason:{},item:{}};
  wdocs.forEach(d=>{
    const x=d.data(),k=dayKey(x.ts);
    if(k<r[0]||k>r[1])return;
    o.c+=x.cost||0;o.n++;
    o.reason[x.reason]=(o.reason[x.reason]||0)+(x.qty||1);o.item[x.item]=(o.item[x.item]||0)+(x.qty||1);
  });
  return o;
}
const topKey=o=>{const e=Object.entries(o).sort((a,b)=>b[1]-a[1]);return e.length?e[0][0]:null};
function delta(c,p,lab){
  if(!p&&!c)return '';
  if(!p)return `<span class="dl up">${T('newTag')}</span>`;
  const v=Math.round((c-p)/p*100);
  return `<span class="dl ${v>=0?'up':'dn'}">${T('delta',v>=0?'▲':'▼',Math.abs(v),lab)}</span>`;
}

  <div class="gbar"><i style="width:${Math.min(100,pct)}%"></i></div>

  return a.concat(b).sort((p,q)=>q.x.ts-p.x.ts);
}
function renderLog(){
  const q=logq.trim();
  const list=unified().filter(({col,x})=>{
    const kind=col==='waste'?'waste':x.type;
    return (logf==='all'||logf===kind)&&inPer(dayKey(x.ts))&&(!q||[x.item,x.supplier,x.note,x.pay,x.cname,x.cphone,x.reason&&reasonL(x.reason)].join(' ').includes(q));
  });
  let s=0,p=0,w=0;
  list.forEach(({col,x})=>{if(col==='waste')w+=x.cost||0;else if(x.type==='sale')s+=x.amount;else p+=x.amount});
  $('#log-sum').innerHTML=T('logSum',list.length,fmt(s),fmt(p),fmt(w));
  $('#log-box').innerHTML=list.slice(0,100).map(({id,col,x})=>{
    const waste=col==='waste',sale=!waste&&x.type==='sale';
    let sub;
    if(waste)sub=`${esc(x.item)} × ${esc(x.qty)} · ${esc(reasonL(x.reason))}`;
    else if(sale)sub=`${esc(x.item)} × ${esc(x.qty)} · ${esc(payL(x.pay))}${x.cname?' · '+esc(x.cname):''}`;
    else sub=`${esc(x.item)}${x.supplier?' · '+esc(x.supplier):''}${x.note?' · '+esc(x.note):''}${x.inv?' · 📎':''}`;
    const amt=waste?x.cost||0:x.amount,cls=waste?'wst':sale?'pos':'neg',sg=waste?'':sale?'+':'−';
    return `<div class="lrow" data-id="${esc(id)}" data-col="${col}"><div class="ic">${waste?'🥀':sale?'🌷':'🛍️'}</div><div class="mid">${sub}<small>${dayKey(x.ts)} · ${hhmm(x.ts)}</small></div><b class="${cls}">${sg}${fmt(amt)}</b></div>`;
  }).join('')||`<div class="note">${T('noEntries')}</div>`;
}

async function saveEdit(){
  if(!editRef)return;
  const {col,id}=editRef,waste=col==='waste',d=(waste?wdocs:docs).find(z=>z.id===id);if(!d)return;
  const x=d.data(),sale=!waste&&x.type==='sale';
  const amount=num($('#e-amt').value);
  if(!waste&&!(amount>0)){msg(T('amtBad'),1,'msg-sheet');return}
  if(waste&&isNaN(amount)){msg(T('amtBad'),1,'msg-sheet');return}
  const u={item:$('#e-item').value},ts=fromLocal($('#e-dt').value);
  if(!isNaN(ts))u.ts=ts;
  if(waste){u.cost=amount;u.qty=num($('#e-qty').value)||1;u.reason=$('#e-reason').value}
  else{u.amount=amount;if(sale){u.qty=num($('#e-qty').value)||1;u.pay=sheetPay}else{u.supplier=$('#e-sup').value.trim();u.note=$('#e-note').value.trim()}}
  try{
    await db.collection(col).doc(id).update(u);
    await audit({action:'edit',kind:waste?'waste':x.type,item:u.item,itemFrom:u.item!==x.item?x.item:'',from:waste?x.cost||0:x.amount,to:amount,at:x.ts});
    closeSheet();
  }catch(err){msg(T('editFail'),1,'msg-sheet')}
}
async function delEntry(btn){
  if(!editRef)return;
  if(!delArm){delArm=true;btn.textContent=T('confirmDel');return}
  const {col,id}=editRef,waste=col==='waste',d=(waste?wdocs:docs).find(z=>z.id===id);
  try{
    const x=d?d.data():{};
    await db.collection(col).doc(id).delete();
    if(x.inv)await delParts(x.inv);
    await audit({action:'delete',kind:waste?'waste':x.type||'sale',item:x.item||'',amount:waste?x.cost||0:x.amount,at:x.ts});
    closeSheet();
  }catch(err){msg(T('delFail'),1,'msg-sheet')}
}

// ================= المواسم =================
const GREG=[{id:'founding',md:'02-22',ar:'يوم التأسيس',en:'Founding Day'},{id:'mother',md:'03-21',ar:'عيد الأم',en:"Mother's Day"},{id:'national',md:'09-23',ar:'اليوم الوطني',en:'National Day'}];
const HIJ=[{id:'ramadan',m:9,d:1,ar:'بداية رمضان',en:'Start of Ramadan'},{id:'fitr',m:10,d:1,ar:'عيد الفطر',en:'Eid al-Fitr'},{id:'adha',m:12,d:10,ar:'عيد الأضحى',en:'Eid al-Adha'}];
let hf=null;
try{const f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{timeZone:'Asia/Riyadh',year:'numeric',month:'numeric',day:'numeric'});if(/islamic/.test(f.resolvedOptions().calendar))hf=f}catch(e){}
function hij(ts){const o={};hf.formatToParts(ts).forEach(p=>{if(p.type!=='literal')o[p.type]=parseInt(p.value,10)});return o}
function scanHij(m,d,from,dir,max){
  for(let i=0;i<=max;i++){const t=from+dir*i*DAY,h=hij(t);if(h.month===m&&h.day===d)return dayStart(dayKey(t))}
  return null;
}
function occList(){
  const now=Date.now(),todayK=dayKey(now),base=dayStart(todayK),noon=base+43200000,Y=+todayK.slice(0,4),out=[];
  const greg=(key,md,name,custom)=>{
    let n=dayStart(`${Y}-${md}`);if(isNaN(n))return;
    if(n<base)n=dayStart(`${Y+1}-${md}`);
    if(isNaN(n))return;
    const yy=+dayKey(n).slice(0,4),p=dayStart(`${yy-1}-${md}`);
    out.push({key,name,next:n,prev:isNaN(p)?null:p,custom,approx:false});
  };
  GREG.forEach(g=>greg(g.id,g.md,g[lang],false));
  occCustom.forEach(c=>greg(c.id,c.md,c.name,true));
  if(hf)HIJ.forEach(h=>{
    const n=scanHij(h.m,h.d,noon,1,400);if(n==null)return;
    const p=scanHij(h.m,h.d,n+43200000-330*DAY,-1,60);
    out.push({key:h.id,name:h[lang],next:n,prev:p,custom:false,approx:true});
  });
  return out.sort((a,b)=>a.next-b.next);
}
function renderOcc(){
  const base=dayStart(dayKey(Date.now()));
  const fd=ts=>new Date(ts).toLocaleDateString(lang==='ar'?'ar-SA-u-ca-gregory-nu-latn':'en-GB',{timeZone:'Asia/Riyadh',weekday:'long',day:'numeric',month:'long'});
  $('#occ-box').innerHTML=occList().map(o=>{
    const left=Math.round((o.next-base)/DAY),dk=o.key+':'+o.prev,d=occData[dk];
    let last;
    if(!o.prev)last=T('occNo');
    else if(!d)last=T('occLoad');
    else if(d==='err'||(!d.n&&!d.p))last=T('occNo');
    else last=T('occLast',fmt(d.s),d.n,fmt(d.p));
    return `<div class="oc ${left<=14?'today':''}"><div class="t"><span>🎉 ${esc(o.name)}</span><span class="tag ${left<=7?'amb':'grn'}">${T('occIn',left)}</span></div>
      <div class="mut">${fd(o.next)}${o.custom?` · ${T('occMine')}`:''}</div>
      ${o.approx?`<div class="mut">${T('occApprox')}</div>`:''}
      <div style="margin-top:6px">${last}</div>
      ${left<=30?`<div class="mut" style="margin-top:6px">💡 ${T('occTip')}</div>`:''}
      ${o.custom?`<div class="acts"><button type="button" class="del" data-odel="${esc(o.key)}">${T('del')}</button></div>`:''}</div>`;
  }).join('');
}
async function loadOcc(){
  if(!db)return;
  for(const o of occList()){
    if(!o.prev)continue;
    const dk=o.key+':'+o.prev;
    if(occData[dk])continue;
    try{
      const es=await rangeEntries(o.prev-10*DAY,o.prev+4*DAY-1);
      let s=0,n=0,p=0;
      es.forEach(x=>{
        if(x.type==='sale'&&x.ts>=o.prev-3*DAY){s+=x.amount;if(!x.dep)n++}
        else if(x.type==='buy'&&x.ts<o.prev)p+=x.amount;
      });
      occData[dk]={s,n,p};
    }catch(e){occData[dk]='err'}
    renderOcc();
  }
}

function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(xlsxP)return xlsxP;
  xlsxP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    const to=setTimeout(()=>{xlsxP=null;rej(new Error('timeout'))},15000);
    s.onload=()=>{clearTimeout(to);window.XLSX?res(window.XLSX):rej(new Error('x'))};
    s.onerror=()=>{clearTimeout(to);xlsxP=null;rej(new Error('x'))};
    document.head.appendChild(s);
  });
  return xlsxP;
}
async function doExport(){
  const mv=$('#ex-month').value;
  if(!/^\d{4}-\d{2}$/.test(mv)){msg(T('exportNone'),1,'msg-ex');return}
  if(!db||!dl){msg(T('exportNA'),1,'msg-ex');return}
  const [Y,M]=mv.split('-').map(Number);
  const a=dayStart(mv+'-01'),b=dayStart(M===12?`${Y+1}-01-01`:`${Y}-${String(M+1).padStart(2,'0')}-01`)-1;
  $('#ex-btn').disabled=true;msg(T('exportBusy'),0,'msg-ex');
  try{
    const get=(col,f)=>db.collection(col).where(f,'>=',a).where(f,'<=',b).get().then(s=>s.docs.map(d=>d.data()));
    const [es,ws]=await Promise.all([get('entries','ts'),get('waste','ts')]);
    const asc=(x,y)=>x.ts-y.ts,dt=ts=>dayKey(ts),tm=ts=>hhmm(ts);
    const sRows=es.filter(x=>x.type==='sale').sort(asc).map(x=>({[T('cDate')]:dt(x.ts),[T('cTime')]:tm(x.ts),[T('cItem')]:x.item,[T('cQty')]:x.qty,[T('cPay')]:payL(x.pay),[T('cAmount')]:x.amount,[T('cCust')]:x.cname||'',[T('cPhone')]:x.cphone||''}));
    const bRows=es.filter(x=>x.type==='buy').sort(asc).map(x=>({[T('cDate')]:dt(x.ts),[T('cTime')]:tm(x.ts),[T('category')]:x.item,[T('cSup')]:x.supplier||'',[T('cAmount')]:x.amount,[T('cInv')]:x.inv?T('yes'):'',[T('cNotes')]:x.note||''}));
    const wRows=ws.sort(asc).map(x=>({[T('cDate')]:dt(x.ts),[T('cTime')]:tm(x.ts),[T('cItem')]:x.item,[T('cQty')]:x.qty,[T('cReason')]:reasonL(x.reason),[T('cAmount')]:x.cost||0}));
    const XL=await loadXLSX();
    const wb=XL.utils.book_new();
    [[sRows,'shSales'],[bRows,'shBuys'],[wRows,'shWaste']].forEach(([rows,k])=>{
      XL.utils.book_append_sheet(wb,XL.utils.json_to_sheet(rows.length?rows:[{}]),T(k));
    });
    if(lang==='ar')wb.Workbook={Views:[{RTL:true}]};
    const out=XL.write(wb,{bookType:'xlsx',type:'array'});
    await dl.save({filename:`floriro-${mv}.xlsx`,data:new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})});
    msg(T('exportDone'),0,'msg-ex');
  }catch(err){msg(err&&err.code==='declined'?T('exportCancel'):T('exportFail'),1,'msg-ex')}
  $('#ex-btn').disabled=false;
}
$('#ex-btn').onclick=doExport;

  docs.forEach(d=>jobs.push(['entries',d.id]));wdocs.forEach(d=>jobs.push(['waste',d.id]));
  try{const fs=await db.collection('invfiles').limit(1000).get();fs.docs.forEach(d=>jobs.push(['invfiles',d.id]))}catch(e){}
  if(!jobs.length){msg(T('wipeNone'),1,'msg-wipe');return}
  $('#wipe').disabled=true;let n=0;
  try{
    for(const [c,id] of jobs){await db.collection(c).doc(id).delete();n++;if(n%10===0)msg(T('wipeProg',n,jobs.length),0,'msg-wipe')}
    await audit({action:'wipe',n});
    $('#wipe-t').value='';msg(T('wipeDone'),0,'msg-wipe');
  }catch(err){msg(T('wipeStop',n),1,'msg-wipe')}
  $('#wipe').disabled=false;
};

// ================= لمسات تفاعلية =================
document.addEventListener('click',e=>{
  const b=e.target.closest('.chips.q button');
  if(!b)return;
  const inp=$('#'+b.parentElement.dataset.for),a=+b.dataset.add;

});
function burst(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(let i=0;i<14;i++){
    const e=document.createElement('span');
    e.className='petal';e.textContent=['🌸','🌷','🌺','✿'][i%4];
    e.style.left=(8+Math.random()*84)+'vw';e.style.animationDelay=(Math.random()*.35)+'s';e.style.fontSize=(16+Math.random()*16)+'px';
    document.body.appendChild(e);setTimeout(()=>e.remove(),2400);
  }
}

// ================= تطبيق اللغة =================
function renderClock(){
  try{
    const now=new Date(),loc=lang==='ar'?'ar-SA-u-ca-gregory-nu-latn':'en-GB',tz='Asia/Riyadh';
    $('#ck-time').textContent=new Intl.DateTimeFormat(loc,{timeZone:tz,hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).format(now);
    $('#ck-date').textContent=new Intl.DateTimeFormat(loc,{timeZone:tz,weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);
    $('#ck-hij').textContent=new Intl.DateTimeFormat((lang==='ar'?'ar-SA':'en-GB')+'-u-ca-islamic-umalqura-nu-latn',{timeZone:tz,day:'numeric',month:'long',year:'numeric'}).format(now);
  }catch(e){}
}
setInterval(renderClock,1000);
function applyLang(){
  const h=document.documentElement;
  h.lang=lang;h.dir=lang==='ar'?'rtl':'ltr';document.title=T('brand');
  document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=T(e.dataset.t)});
  document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=T(e.dataset.ph)});
  $('#langb').textContent=T('langBtn');
  if(!hasSaved)lists={sale:L[lang].dItems.slice(),buy:L[lang].dBuy.slice(),waste:L[lang].dWaste.slice()};
  renderClock();closeSheet();fillSelects();renderItems();renderDash(false);renderLog();renderAudit();renderCust();renderOcc();
  if(!$('#v-lock').classList.contains('hide'))mountLock();
}

// ================= التشغيل =================
function startAdmin(){
  if(adminStarted)return;if(!db){ensureDb();return}
  adminStarted=true;
  adminUnsubs.push(db.collection('entries').orderBy('ts','desc').limit(1000).onSnapshot(s=>{docs=s.docs;renderDash(firstSnap&&unlocked&&sub==='dash');firstSnap=false;renderLog();renderCust()},er=>{window.__dbg&&window.__dbg('entries: '+(er&&er.code)+' - '+(er&&er.message));$('#a-dash').innerHTML=`<div class="note">${T('loadFail')}<br><small dir="ltr">${(er&&er.code)||''}</small></div>`}));
  adminUnsubs.push(db.collection('waste').orderBy('ts','desc').limit(500).onSnapshot(s=>{wdocs=s.docs;renderDash(false);renderLog()},er=>{window.__dbg&&window.__dbg('waste: '+(er&&er.code))}));
  adminUnsubs.push(db.collection('audit').orderBy('ts','desc').limit(100).onSnapshot(s=>{adocs=s.docs;renderAudit()},er=>{window.__dbg&&window.__dbg('audit: '+(er&&er.code))}));
}
let subbed=false,dbBusy=null;
function subscribeAll(){
  if(subbed||!db)return;subbed=true;
  db.doc('settings/items').onSnapshot(s=>{
    if(s.exists){const d=s.data()||{};hasSaved=true;lists={sale:Array.isArray(d.sale)?d.sale:[],buy:Array.isArray(d.buy)?d.buy:[],waste:Array.isArray(d.waste)?d.waste:L[lang].dWaste.slice()}}
    fillSelects();if(unlocked)renderItems();
  },()=>{});
  db.doc('settings/pin').onSnapshot(s=>{pinHash=s.exists&&s.data()?s.data().h||null:null},()=>{});
  db.doc('settings/goal').onSnapshot(s=>{
    const a=s.exists&&s.data()?+s.data().amount:0;goal=a>0?a:0;
    if(document.activeElement!==$('#goal-in'))$('#goal-in').value=goal||'';
    if(unlocked)renderDash(false);
  },()=>{});
  db.doc('settings/occ').onSnapshot(s=>{
    occCustom=s.exists&&s.data()&&Array.isArray(s.data().list)?s.data().list:[];
    if(unlocked&&sub==='occ'){renderOcc();loadOcc()}
  },()=>{});
  if(unlocked)startAdmin();
}
async function ensureDb(){
  if(db){subscribeAll();return true}
  if(window.__auth&&window.__auth.currentUser){db=window.__fs;subscribeAll();return true}
  return false;
}
